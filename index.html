<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <title>Quiz application</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
      <div class="card m-auto quizCard">
        <div class="card-body">
          <h3 class="card-title text-center">Quiz</h3>
          <div class="text mt-3">
            <div class="card-text " id="qnsnum">qns 1/10</div>
            <div class="time" id="timeleft">time left 30</div>
          </div>
          <h5 class="text-center mt-4" id="que">question will appear here</h3>

          <div class="row" id="options">

          </div>
          <a href="#" class="btn btn-primary mt-5 w-100 " id="nextque">Next question</a>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>

    <script src="./script.js"></script>
  </body>
</html>
